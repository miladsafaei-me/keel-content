[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-content"
version = "0.1.0"
description = "Keel Content — a reusable, business-blind content-generation pipeline (intake, generator, figures/hero/external-links, glossary authoring) extracted from SignalBots."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Milad Safaei", email = "miladsafaei.me@gmail.com" }]
license = { text = "UNLICENSED" }
dependencies = [
    "Django>=4.2",
    "anthropic>=0.40",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "keel-ui",
]

[project.optional-dependencies]
raster = ["playwright>=1.40"]
admin = ["django-unfold>=0.20"]

[project.urls]
Homepage = "https://github.com/miladsafaei-me/keel-content"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_content"]

[tool.hatch.build.targets.wheel.force-include]
"src/keel_content/prompts_default" = "keel_content/prompts_default"
"src/keel_content/fonts" = "keel_content/fonts"
"src/keel_content/fixtures" = "keel_content/fixtures"
"src/keel_content/tools" = "keel_content/tools"
